<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Liquid Chat · 液态玻璃聊天室</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
:root{--accent:#5eead4;--accent-rgb:94,234,212;--text:#eef2ff;--text-dim:rgba(238,242,255,.52);--glass:rgba(255,255,255,.065);--stroke:rgba(255,255,255,.14);--blur:26px;--radius:24px;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;color:var(--text);background:#05060b;overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.13);border-radius:99px}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden}.bg .blob{position:absolute;width:56vmax;height:56vmax;border-radius:50%;filter:blur(95px);opacity:.55;mix-blend-mode:screen;animation:fl 25s ease-in-out infinite}
.b1{top:-20vmax;left:-16vmax;background:#5eead4}.b2{bottom:-26vmax;right:-18vmax;background:#818cf8;animation-delay:-5s}.b3{top:30%;left:50%;width:40vmax;height:40vmax;background:#f472b6;animation-delay:-10s}
@keyframes fl{50%{transform:translate3d(10vmax,10vmax,0) scale(1.2)}}
.glass{position:relative;background:var(--glass);backdrop-filter:blur(var(--blur)) saturate(185%);border:1px solid var(--stroke);border-radius:var(--radius);box-shadow:0 24px 70px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.24)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(120% 90% at 100% 0%,rgba(var(--accent-rgb),.14),transparent 58%),linear-gradient(142deg,rgba(255,255,255,.17),transparent 46%);mix-blend-mode:screen;pointer-events:none}
button,input,textarea{font-family:inherit;color:inherit;outline:none;border:none;background:none}
button{cursor:pointer}
input,textarea{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:12px;color:var(--text);font-size:14.5px;transition:.22s;width:100%}
input:focus,textarea:focus{border-color:rgba(var(--accent-rgb),.55);box-shadow:0 0 0 4px rgba(var(--accent-rgb),.13)}
.primary-btn{width:100%;padding:13px;border-radius:15px;background:linear-gradient(135deg,rgba(var(--accent-rgb),.95),rgba(var(--accent-rgb),.62));color:#04141a;font-weight:700;font-size:15px;box-shadow:0 10px 30px rgba(var(--accent-rgb),.28)}
.ghost-btn{padding:10px 16px;border-radius:13px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12)}
.danger-btn{background:rgba(239,68,68,.2);border:1px solid rgba(239,68,68,.5);color:#fca5a5}
.icon-btn{width:38px;height:38px;flex:0 0 auto;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.11);font-size:15px}
.hidden{display:none!important}
.avatar{width:46px;height:46px;flex:0 0 auto;border-radius:15px;display:grid;place-items:center;font-weight:800;font-size:17px;color:#06141b;overflow:hidden;background:linear-gradient(140deg,#5eead4,#0ea5e9);box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.avatar.sm{width:36px;height:36px;border-radius:12px;font-size:14px}
.avatar.lg{width:60px;height:60px;border-radius:19px;font-size:22px}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.screen{position:fixed;inset:0;z-index:1;display:flex}.screen.center{align-items:center;justify-content:center;padding:22px}
.auth-card{width:min(440px,100%);padding:40px;animation:cardIn .6s cubic-bezier(.19,1,.22,1)}
@keyframes cardIn{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.brand{text-align:center;margin-bottom:26px}.brand-logo{width:74px;height:74px;margin:0 auto 16px;border-radius:24px;display:grid;place-items:center;font-size:36px;background:linear-gradient(140deg,rgba(var(--accent-rgb),.45),rgba(255,255,255,.06));border:1px solid rgba(255,255,255,.22)}
.brand h1{margin:0;font-size:27px}.brand p{margin:7px 0 0;font-size:13px;color:var(--text-dim)}
.tabs{display:flex;gap:5px;padding:5px;border-radius:16px;background:rgba(255,255,255,.05);margin-bottom:22px}
.tab{flex:1;padding:10px;border-radius:12px;font-size:14.5px;color:var(--text-dim)}.tab.active{background:linear-gradient(135deg,rgba(var(--accent-rgb),.9),rgba(var(--accent-rgb),.6));color:#04141a}
.field{margin-bottom:15px}.field label{display:block;font-size:12.5px;color:var(--text-dim);margin-bottom:7px}
.form-msg{font-size:13px;min-height:18px;margin:4px 0 10px;color:#ff8b8b}.form-msg.ok{color:var(--accent)}
#mainScreen{padding:16px;gap:16px}.sidebar{width:342px;flex:0 0 342px;display:flex;flex-direction:column;border-radius:26px;overflow:hidden}
.side-head{display:flex;align-items:center;gap:12px;padding:18px}.side-actions{display:flex;gap:8px;padding:0 16px 12px}.pill-btn{flex:1;padding:10px;border-radius:13px;font-size:13.5px;font-weight:600;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.11)}
.search-wrap{padding:0 16px 10px}.side-tabs{display:flex;gap:4px;padding:0 16px 8px}.st{flex:1;padding:9px;border-radius:11px;font-size:13.5px;color:var(--text-dim)}.st.active{background:rgba(255,255,255,.1);color:var(--text)}
.list{flex:1;overflow-y:auto;padding:6px 10px 14px}.item{display:flex;gap:12px;align-items:center;padding:11px 12px;border-radius:16px;cursor:pointer}.item:hover{background:rgba(255,255,255,.065)}
.item.active{background:linear-gradient(120deg,rgba(var(--accent-rgb),.2),rgba(var(--accent-rgb),.06));border:1px solid rgba(var(--accent-rgb),.32)}
.item-body{flex:1;min-width:0}.item-name{font-size:14.5px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.item-sub{font-size:12.5px;color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-actions{opacity:0;transition:.2s}.item:hover .item-actions{opacity:1}.item-del{width:28px;height:28px;border-radius:8px;background:rgba(239,68,68,.18);color:#fca5a5;display:grid;place-items:center}
.empty-tip{text-align:center;color:var(--text-dim);font-size:13.5px;padding:44px 20px;line-height:2}
.chat{flex:1;display:flex;flex-direction:column;border-radius:26px;overflow:hidden}#chatEmpty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:var(--text-dim);text-align:center;padding:30px}
.chat-inner{flex:1;display:flex;flex-direction:column;min-height:0}.chat-head{display:flex;align-items:center;gap:13px;padding:16px 20px;border-bottom:1px solid rgba(255,255,255,.08)}
.messages{flex:1;overflow-y:auto;padding:22px}.msg{display:flex;gap:10px;margin-bottom:16px}.msg.me{flex-direction:row-reverse}
.bwrap{display:flex;flex-direction:column;max-width:72%}.msg.me .bwrap{align-items:flex-end}
.bubble{padding:11px 15px;border-radius:18px;background:rgba(255,255,255,.075);font-size:14.5px;line-height:1.6;word-break:break-word;white-space:pre-wrap}
.msg.me .bubble{background:linear-gradient(135deg,rgba(var(--accent-rgb),.34),rgba(var(--accent-rgb),.15));border-bottom-right-radius:6px}
.msg:not(.me) .bubble{border-bottom-left-radius:6px}.bubble-img img{max-width:100%;max-height:300px;border-radius:14px;display:block}
.composer{display:flex;gap:10px;align-items:flex-end;padding:14px 18px;border-top:1px solid rgba(255,255,255,.08)}
.send-btn{padding:0 24px;height:46px;border-radius:16px;background:linear-gradient(135deg,rgba(var(--accent-rgb),.95),rgba(var(--accent-rgb),.6));color:#04141a;font-weight:700}
.overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:22px;background:rgba(2,4,10,.55);backdrop-filter:blur(8px);opacity:0;transition:.25s;pointer-events:none}
.overlay.show{opacity:1;pointer-events:auto}.modal{width:min(500px,100%);max-height:86vh;overflow-y:auto;border-radius:26px;transform:translateY(18px);transition:.3s}.overlay.show .modal{transform:none}
#toast{position:fixed;left:50%;bottom:44px;transform:translate(-50%,26px);padding:12px 22px;border-radius:99px;font-size:14px;background:rgba(20,24,34,.86);border:1px solid rgba(255,255,255,.16);opacity:0;transition:.3s;z-index:99}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:880px){#mainScreen{padding:0;gap:0}.sidebar{width:100%;border-radius:0}.chat{position:fixed;inset:0;transform:translateX(100%);transition:transform .34s}body.show-chat .chat{transform:none}.bwrap{max-width:82%}}
</style>
</head>
<body>

<div class="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>

<div id="authScreen" class="screen center">
  <div class="auth-card glass">
    <div class="brand"><div class="brand-logo">💧</div><h1>Liquid Chat</h1><p>LIQUID GLASS · 实时聊天室</p></div>
    <div class="tabs"><button class="tab active" data-mode="login">登录</button><button class="tab" data-mode="register">注册</button></div>
    <form id="authForm" autocomplete="off">
      <div id="regFields" class="hidden"><div class="field"><label>昵称</label><input id="regName" maxlength="12" placeholder="给自己起个名字" /></div></div>
      <div id="loginFields"><div class="field"><label>账号 ID</label><input id="loginId" inputmode="numeric" maxlength="6" placeholder="6 位数字 ID" /></div></div>
      <div class="field"><label>密码</label><input id="authPwd" type="password" placeholder="至少 4 位" /></div>
      <div id="regFields2" class="hidden"><div class="field"><label>确认密码</label><input id="regPwd2" type="password" placeholder="再输入一次" /></div></div>
      <div class="form-msg" id="authMsg"></div>
      <button type="submit" class="primary-btn" id="authSubmit">登 录</button>
    </form>
  </div>
</div>

<div id="mainScreen" class="screen hidden">
  <aside class="sidebar glass">
    <div class="side-head">
      <div class="avatar" id="myAvatar" style="cursor:pointer">?</div>
      <div class="me-info"><div id="myName">—</div><div id="myId" style="font-size:11.5px;color:var(--text-dim);cursor:pointer">ID: —</div></div>
      <button class="icon-btn" id="btnProfile">👤</button><button class="icon-btn" id="btnLogout">⎋</button>
    </div>
    <div class="side-actions"><button class="pill-btn" id="btnAddFriend">＋ 加好友</button><button class="pill-btn" id="btnNewGroup">✦ 建群</button></div>
    <div class="search-wrap"><input id="searchInput" placeholder="搜索聊天 / 好友…" /></div>
    <div class="side-tabs"><button class="st active" data-view="chats">消息</button><button class="st" data-view="friends">好友</button></div>
    <div class="list" id="list"></div>
  </aside>
  <main class="chat glass">
    <div id="chatEmpty"><div style="font-size:64px">🫧</div><h2>开始你的对话</h2><p>左侧选择一位好友或群聊</p></div>
    <div class="chat-inner hidden" id="chatInner">
      <header class="chat-head"><button class="icon-btn" id="btnBack">‹</button><div class="avatar" id="chatAvatar">?</div><div style="flex:1"><div id="chatName">—</div><div id="chatSub" style="font-size:12px;color:var(--text-dim)">—</div></div><button class="icon-btn hidden" id="btnGroupSettings">⚙️</button></header>
      <div class="messages" id="messages"></div>
      <div class="composer"><button class="icon-btn" id="btnImage">🖼️</button><input type="file" id="imageInput" accept="image/*" hidden><textarea id="msgInput" rows="1" placeholder="输入消息…"></textarea><button class="send-btn" id="btnSend">发送</button></div>
    </div>
  </main>
</div>
<div class="overlay hidden" id="overlay"><div class="modal glass" id="modal"></div></div>

<script>
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36);
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ✅ 你的真实密钥已经填好了，直接复制就能用
const SUPABASE_URL = "https://qjsupbxshubysfnyhbwe.supabase.co";
const SUPABASE_KEY = "sb_publishable_PLydvfYMjBWnFY2eKSxTgQ_BAxYwTZp"; 
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let me = null, activeChat = null, view = 'chats', searchTerm = '', pollingTimer = null;

function toast(msg){ let el=$('#toast'); if(!el){el=document.createElement('div');el.id='toast';document.body.appendChild(el);} el.textContent=msg; el.classList.add('show'); clearTimeout(window._tt); window._tt=setTimeout(()=>el.classList.remove('show'),2200); }
function avatarHTML(u, cls='') { if(!u) return `<div class="avatar ${cls}">?</div>`; if(u.avatar) return `<div class="avatar ${cls}"><img src="${esc(u.avatar)}"></div>`; return `<div class="avatar ${cls}" style="background:linear-gradient(140deg,#5eead4,#0ea5e9)">${esc((u.name||'?')[0])}</div>`; }
function fmtTime(ts){ const d=new Date(Number(ts)); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }

async function boot() {
  const savedId = localStorage.getItem('chat_uid');
  if (savedId) { await loadMe(savedId); } else { showAuth(); }
}
function showAuth(){ $('#authScreen').classList.remove('hidden'); $('#mainScreen').classList.add('hidden'); }
function setAuthMode(mode){ $$('.tab').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode)); $('#regFields').classList.toggle('hidden',mode!=='register'); $('#regFields2').classList.toggle('hidden',mode!=='register'); $('#loginFields').classList.toggle('hidden',mode!=='login'); $('#authSubmit').textContent = mode==='login'?'登 录':'创建账号'; }
$$('.tab').forEach(b=>b.onclick=()=>setAuthMode(b.dataset.mode));
$('#authForm').onsubmit = async e => {
  e.preventDefault();
  const pwd = $('#authPwd').value.trim();
  if (authMode === 'register') {
    const name = $('#regName').value.trim();
    if (!name || pwd.length < 4) return toast('昵称和密码不能为空（密码至少4位）');
    if (pwd !== $('#regPwd2').value.trim()) return toast('两次密码不一致');
    const { data: users } = await supabase.from('users').select('id');
    let max = 0; users.forEach(u => { const n = parseInt(u.id); if (n > max) max = n; });
    const id = String(max+1).padStart(6, '0');
    const { error } = await supabase.from('users').insert({ id, name, pwd, avatar: '', created_at: Date.now() });
    if (error) return toast('注册失败：' + error.message);
    localStorage.setItem('chat_uid', id); await loadMe(id); toast('注册成功，你的 ID 是 ' + id);
  } else {
    const id = $('#loginId').value.trim();
    const { data: u } = await supabase.from('users').select('*').eq('id', id).single();
    if (!u || u.pwd !== pwd) return toast('ID 不存在或密码错误');
    localStorage.setItem('chat_uid', id); await loadMe(id); toast('欢迎回来，' + u.name);
  }
};
async function loadMe(id) {
  const { data: u } = await supabase.from('users').select('*').eq('id', id).single();
  if (!u) return showAuth();
  me = u; $('#authScreen').classList.add('hidden'); $('#mainScreen').classList.remove('hidden');
  refreshProfile(); renderList();
  if (pollingTimer) clearInterval(pollingTimer);
  pollingTimer = setInterval(() => { renderList(); renderMessages(); }, 3000);
}
function refreshProfile() {
  const av = $('#myAvatar'); av.outerHTML = avatarHTML(me, 'lg').replace('class="avatar lg"', 'class="avatar lg" id="myAvatar" style="cursor:pointer"');
  $('#myName').textContent = me.name; $('#myId').textContent = 'ID: ' + me.id;
}
$('#myId').onclick = () => navigator.clipboard.writeText(me.id).then(()=>toast('ID已复制：'+me.id));
$('#myAvatar').onclick = () => openProfile();

async function renderList() {
  if (!me) return;
  const q = searchTerm.trim().toLowerCase(); let html = '';
  if (view === 'chats') {
    const { data: chats } = await supabase.from('chats').select('*');
    const { data: msgs } = await supabase.from('messages').select('*').order('created_at', { ascending: false });
    const myChats = chats.filter(c => c.members && c.members.includes(me.id) && !c.deleted);
    if (!myChats.length) html = '<div class="empty-tip">还没有聊天<br>点「加好友」开始吧 ✨</div>';
    else {
      html = myChats.map(c => {
        const last = msgs.find(m => m.chat_id === c.id);
        let name = c.type === 'dm' ? '私聊' : c.name;
        let av = c.type === 'dm' ? '<div class="avatar sm" style="background:linear-gradient(140deg,#5eead4,#0ea5e9)">💬</div>' : '<div class="avatar sm" style="background:linear-gradient(140deg,#818cf8,#a855f7)">👥</div>';
        let preview = last ? (last.type === 'image' ? '[图片]' : last.content) : '开始聊天吧';
        return `<div class="item ${activeChat?.id===c.id?'active':''}" onclick="openChat('${c.id}')">${av}<div class="item-body"><div class="item-name">${esc(name)}</div><div class="item-sub">${esc(preview.slice(0,20))}</div></div></div>`;
      }).join('');
    }
  } else {
    const { data: fr } = await supabase.from('friends').select('friend_id').eq('user_id', me.id);
    const ids = fr.map(f => f.friend_id);
    if (!ids.length) html = '<div class="empty-tip">还没有好友<br>用 ID 搜索并添加吧 🔍</div>';
    else {
      const { data: users } = await supabase.from('users').select('*').in('id', ids);
      html = users.map(u => `<div class="item" onclick="startDM('${u.id}')">${avatarHTML(u)}<div class="item-body"><div class="item-name">${esc(u.name)}</div><div class="item-sub">ID: ${u.id}</div></div><div class="item-actions"><button class="item-del" onclick="event.stopPropagation();delFriend('${u.id}')">✕</button></div></div>`).join('');
    }
  }
  $('#list').innerHTML = html;
}

async function openChat(id) {
  const { data: c } = await supabase.from('chats').select('*').eq('id', id).single();
  if (!c || c.deleted) return toast('该聊天已解散');
  activeChat = c; document.body.classList.add('show-chat');
  $('#chatEmpty').classList.add('hidden'); $('#chatInner').classList.remove('hidden');
  $('#chatName').textContent = c.type === 'dm' ? '私聊' : c.name;
  $('#chatSub').textContent = c.type === 'group' ? c.members.length + ' 位成员' : '';
  $('#btnGroupSettings').classList.toggle('hidden', c.type !== 'group');
  renderMessages();
}
function renderMessages() {
  if (!activeChat) return;
  supabase.from('messages').select('*').eq('chat_id', activeChat.id).order('created_at').then(({data: msgs}) => {
    $('#messages').innerHTML = msgs.map(m => {
      const mine = m.sender === me.id;
      let content = m.type === 'image' ? `<div class="bubble bubble-img"><img src="${esc(m.content)}"></div>` : `<div class="bubble">${esc(m.content)}</div>`;
      return `<div class="msg ${mine?'me':''}"><div class="bwrap">${content}<div style="font-size:10.5px;color:var(--text-dim);margin-top:4px">${fmtTime(m.created_at)}</div></div></div>`;
    }).join('');
    $('#messages').scrollTop = $('#messages').scrollHeight;
  });
}
$('#btnSend').onclick = async () => {
  const text = $('#msgInput').value.trim(); if (!text || !activeChat) return;
  await supabase.from('messages').insert({ id: uid(), chat_id: activeChat.id, sender: me.id, type: 'text', content: text, created_at: Date.now() });
  $('#msgInput').value = ''; renderMessages();
};
$('#msgInput').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#btnSend').click(); } };
$('#btnImage').onclick = () => { if(activeChat) $('#imageInput').click(); };
$('#imageInput').onchange = e => {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = async ev => {
    const canvas = document.createElement('canvas'); const img = new Image();
    img.onload = async () => {
      const ratio = Math.min(1200/img.width, 1200/img.height, 1);
      canvas.width = img.width * ratio; canvas.height = img.height * ratio;
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      const data = canvas.toDataURL('image/jpeg', 0.75);
      await supabase.from('messages').insert({ id: uid(), chat_id: activeChat.id, sender: me.id, type: 'image', content: data, created_at: Date.now() });
      renderMessages();
    }; img.src = ev.target.result;
  }; reader.readAsDataURL(file);
};

async function startDM(fid) {
  const ids = [me.id, fid].sort(); const dmId = 'dm_' + ids.join('_');
  const { data: exist } = await supabase.from('chats').select('*').eq('id', dmId).single();
  if (!exist) await supabase.from('chats').insert({ id: dmId, type: 'dm', members: ids, created_at: Date.now(), owner: '', name: '' });
  openChat(dmId);
}
async function delFriend(fid) {
  if (!confirm('确定删除该好友吗？')) return;
  await supabase.from('friends').delete().eq('user_id', me.id).eq('friend_id', fid);
  await supabase.from('friends').delete().eq('user_id', fid).eq('friend_id', me.id);
  renderList();
}
$('#btnAddFriend').onclick = () => {
  openModal('<div class="modal-head"><h3>添加好友</h3><button class="icon-btn" data-close>✕</button></div><div class="modal-body"><div class="field"><label>输入对方 ID</label><input id="fId" maxlength="6"></div><button class="primary-btn" id="doAdd">加好友</button></div>', md => {
    md.querySelector('#doAdd').onclick = async () => {
      const id = md.querySelector('#fId').value.trim();
      if (id === me.id) return toast('不能加自己');
      const { data: u } = await supabase.from('users').select('*').eq('id', id).single();
      if (!u) return toast('用户不存在');
      await supabase.from('friends').insert([{ user_id: me.id, friend_id: id }, { user_id: id, friend_id: me.id }]);
      toast('已添加 ' + u.name); closeModal(); renderList();
    };
  });
};
$('#btnNewGroup').onclick = () => {
  supabase.from('friends').select('friend_id').eq('user_id', me.id).then(async ({data: fr}) => {
    const ids = fr.map(f => f.friend_id);
    const { data: users } = await supabase.from('users').select('*').in('id', ids);
    openModal(`<div class="modal-head"><h3>创建群聊</h3><button class="icon-btn" data-close>✕</button></div><div class="modal-body"><div class="field"><label>群名称</label><input id="gName"></div><div class="field"><label>选择成员</label>${users.map(u=>`<label class="pick"><input type="checkbox" value="${u.id}">${avatarHTML(u,'sm')} ${u.name}</label>`).join('')}</div><button class="primary-btn" id="doCreate">创建群聊</button></div>`, md => {
      md.querySelector('#doCreate').onclick = async () => {
        const name = md.querySelector('#gName').value.trim();
        const members = [me.id, ...[...md.querySelectorAll('input:checked')].map(i=>i.value)];
        if (!name || members.length < 2) return toast('请填写群名并选择成员');
        await supabase.from('chats').insert({ id: 'g_' + uid(), type: 'group', name, owner: me.id, members, deleted: false, created_at: Date.now() });
        closeModal(); renderList(); toast('群聊已创建');
      };
    });
  });
};
$('#btnGroupSettings').onclick = () => {
  if (!activeChat || activeChat.type !== 'group') return;
  const isOwner = activeChat.owner === me.id;
  supabase.from('users').select('*').in('id', activeChat.members).then(({data: us}) => {
    openModal(`<div class="modal-head"><h3>群设置</h3><button class="icon-btn" data-close>✕</button></div><div class="modal-body"><div class="field"><label>群成员</label>${us.map(u=>`<div class="pick" style="cursor:default">${avatarHTML(u,'sm')} ${u.name} ${u.id===activeChat.owner?'👑':''} ${isOwner&&u.id!==me.id?`<button class="item-del" onclick="kick('${u.id}')">踢</button>`:''}</div>`).join('')}</div>${isOwner ? `<button class="danger-btn" id="doDissolve" style="width:100%">解散群聊</button>` : `<button class="danger-btn" id="doExit" style="width:100%">退出群聊</button>`}<div style="height:8px"></div><button class="primary-btn" data-close>关闭</button></div>`, md => {
      if (isOwner) md.querySelector('#doDissolve').onclick = async () => {
        if (!confirm('确定解散？')) return;
        await supabase.from('chats').update({ deleted: true, members: [] }).eq('id', activeChat.id);
        activeChat = null; document.body.classList.remove('show-chat'); closeModal(); renderList(); toast('已解散');
      };
      else md.querySelector('#doExit').onclick = async () => {
        if (!confirm('确定退出？')) return;
        const newM = activeChat.members.filter(id => id !== me.id);
        await supabase.from('chats').update({ members: newM }).eq('id', activeChat.id);
        activeChat = null; document.body.classList.remove('show-chat'); closeModal(); renderList(); toast('已退出');
      };
    });
  });
};
window.kick = async (id) => { if(!confirm('确定踢出？')) return; const nm = activeChat.members.filter(i=>i!==id); await supabase.from('chats').update({members: nm}).eq('id', activeChat.id); renderMessages(); toast('已踢出'); };
function openProfile() {
  openModal(`<div class="modal-head"><h3>个人中心</h3><button class="icon-btn" data-close>✕</button></div><div class="modal-body"><div class="field" style="text-align:center"><div id="prev" style="display:flex;justify-content:center">${avatarHTML(me,'lg')}</div><input type="file" id="avFile" accept="image/*" style="margin-top:10px"></div><div class="field"><label>昵称</label><input id="pName" value="${esc(me.name)}"></div><button class="primary-btn" id="doSave">保存修改</button></div>`, md => {
    let newAv = me.avatar;
    md.querySelector('#avFile').onchange = e => { const f = e.target.files[0]; if(!f) return; const r = new FileReader(); r.onload = ev => { newAv = ev.target.result; md.querySelector('#prev').innerHTML = `<div class="avatar lg"><img src="${newAv}"></div>`; }; r.readAsDataURL(f); };
    md.querySelector('#doSave').onclick = async () => {
      const name = md.querySelector('#pName').value.trim(); if(!name) return toast('昵称不能为空');
      await supabase.from('users').update({ name, avatar: newAv }).eq('id', me.id);
      me.name = name; me.avatar = newAv; refreshProfile(); closeModal(); toast('资料已更新');
    };
  });
}
$('#btnProfile').onclick = () => openProfile();
function openModal(html, onMount){ const ov=$('#overlay'); $('#modal').innerHTML=html; ov.classList.remove('hidden'); requestAnimationFrame(()=>ov.classList.add('show')); $('#modal').querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal); onMount && onMount($('#modal')); }
function closeModal(){ $('#overlay').classList.remove('show'); setTimeout(()=>$('#overlay').classList.add('hidden'),240); }
$('#overlay').onclick = e => { if(e.target===$('#overlay')) closeModal(); };
$('#btnBack').onclick = () => document.body.classList.remove('show-chat');
$('#btnLogout').onclick = () => { localStorage.removeItem('chat_uid'); location.reload(); };
$$('.st').forEach(b=>b.onclick=()=>{ view=b.dataset.view; $$('.st').forEach(x=>x.classList.toggle('active',x===b)); renderList(); });
$('#searchInput').oninput = e => { searchTerm = e.target.value; renderList(); };
boot();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>管理后台 · Liquid Chat</title>
<style>
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow-x:hidden}
:root{--accent:#5eead4;--accent-rgb:94,234,212;--text:#eef2ff;--text-dim:rgba(238,242,255,.52);--glass:rgba(255,255,255,.065);--stroke:rgba(255,255,255,.14);--blur:26px;--radius:24px;--ease-bounce:cubic-bezier(0.34, 1.56, 0.64, 1);--ease-smooth:cubic-bezier(0.19, 1, 0.22, 1);}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;color:var(--text);background:#05060b;overflow:hidden;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.13);border-radius:99px}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden}.bg .blob{position:absolute;width:56vmax;height:56vmax;border-radius:50%;filter:blur(95px);opacity:.55;mix-blend-mode:screen;animation:fl 25s ease-in-out infinite}
.b1{top:-20vmax;left:-16vmax;background:#5eead4}.b2{bottom:-26vmax;right:-18vmax;background:#818cf8;animation-delay:-5s}
@keyframes fl{50%{transform:translate3d(10vmax,10vmax,0) scale(1.2)}}
.glass{position:relative;background:var(--glass);backdrop-filter:blur(var(--blur)) saturate(185%);-webkit-backdrop-filter:blur(var(--blur)) saturate(185%);border:1px solid var(--stroke);border-radius:var(--radius);box-shadow:0 24px 70px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.24);isolation:isolate}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(120% 90% at 100% 0%,rgba(var(--accent-rgb),.14),transparent 58%),linear-gradient(142deg,rgba(255,255,255,.17),transparent 46%);mix-blend-mode:screen;pointer-events:none}
.glass>*{position:relative;z-index:1}
button,input,textarea{font-family:inherit;color:inherit;outline:none;border:none;background:none}
button{cursor:pointer;transition:transform .2s var(--ease-bounce),opacity .2s}
button:active{transform:scale(.95)}
input{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:12px;color:var(--text);font-size:14.5px;transition:.22s;width:100%}
input:focus{border-color:rgba(var(--accent-rgb),.55);background:rgba(255,255,255,.085);box-shadow:0 0 0 4px rgba(var(--accent-rgb),.13)}
.primary-btn{width:100%;padding:13px;border-radius:15px;background:linear-gradient(135deg,rgba(var(--accent-rgb),.95),rgba(var(--accent-rgb),.62));color:#04141a;font-weight:700;font-size:15px;box-shadow:0 10px 30px rgba(var(--accent-rgb),.28);transition:transform .2s var(--ease-bounce)}
.ghost-btn{padding:10px 16px;border-radius:13px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);transition:background .2s,transform .2s var(--ease-bounce)}
.danger-btn{padding:8px 14px;border-radius:11px;font-size:13px;background:rgba(239,68,68,.2);border:1px solid rgba(239,68,68,.5);color:#fca5a5;transition:background .2s,transform .2s var(--ease-bounce)}
.danger-btn:hover{background:rgba(239,68,68,.35)}
.hidden{display:none!important}
.avatar{width:46px;height:46px;flex:0 0 auto;border-radius:15px;display:grid;place-items:center;font-weight:800;font-size:17px;color:#06141b;overflow:hidden;background:linear-gradient(140deg,#5eead4,#0ea5e9);box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.screen{position:fixed;inset:0;z-index:1;display:flex}.screen.center{align-items:center;justify-content:center;padding:22px}
.admin-card{width:min(440px,100%);padding:40px;animation:cardIn .65s var(--ease-bounce)}
@keyframes cardIn{from{opacity:0;transform:translateY(26px) scale(.96)}to{opacity:1;transform:none}}
.brand{text-align:center;margin-bottom:26px}
.brand-logo{width:74px;height:74px;margin:0 auto 16px;border-radius:24px;display:grid;place-items:center;font-size:36px;background:linear-gradient(140deg,rgba(239,68,68,.45),rgba(255,255,255,.06));border:1px solid rgba(255,255,255,.22);box-shadow:0 18px 50px rgba(239,68,68,.3);animation:bob 5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-3deg)}}
.brand h1{margin:0;font-size:27px;letter-spacing:-.6px}
.brand p{margin:7px 0 0;font-size:13px;color:var(--text-dim);letter-spacing:1.4px}
.field{margin-bottom:15px}.field label{display:block;font-size:12.5px;color:var(--text-dim);margin-bottom:7px}
#adminPanel{padding:16px;gap:16px;width:100%;max-width:100vw;overflow:hidden;flex-direction:column;display:none}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:18px;border-radius:24px}
.panel-head h2{margin:0;font-size:18px}
.list{flex:1;overflow-y:auto;padding:12px 18px 24px;display:flex;flex-direction:column;gap:8px}
.user-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);transition:background .2s,transform .2s var(--ease-bounce)}
.user-item:hover{background:rgba(255,255,255,.08)}
.user-body{flex:1;min-width:0}
.user-name{font-size:14.5px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-info{font-size:12px;color:var(--text-dim);margin-top:3px;word-break:break-all}
.user-actions{display:flex;gap:6px;flex-wrap:wrap}
.status-tag{font-size:11px;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12)}
.status-tag.banned{background:rgba(239,68,68,.2);border-color:rgba(239,68,68,.5);color:#fca5a5}
.status-tag.title-tag{background:linear-gradient(135deg,rgba(var(--accent-rgb),.35),rgba(var(--accent-rgb),.12));border-color:rgba(var(--accent-rgb),.5);color:var(--text)}
#toast{position:fixed;left:50%;bottom:44px;transform:translate(-50%,26px);padding:12px 22px;border-radius:99px;font-size:14px;z-index:99;background:rgba(20,24,34,.86);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(20px);opacity:0;transition:transform .4s var(--ease-bounce),opacity .3s;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:880px){#adminPanel{max-width:900px;margin:0 auto;display:flex;flex-direction:column;height:100vh}}
</style>
</head>
<body>

<div class="bg"><div class="blob b1"></div><div class="blob b2"></div></div>

<div id="authScreen" class="screen center">
  <div class="admin-card glass">
    <div class="brand">
      <div class="brand-logo">🛡️</div>
      <h1>管理后台</h1>
      <p>LIQUID CHAT · ADMIN PANEL</p>
    </div>
    <div class="field">
      <label>管理员密码</label>
      <input id="adminPwd" type="password" placeholder="请输入管理员密码" />
    </div>
    <div class="form-msg" id="authMsg" style="color:#ff8b8b;font-size:13px;min-height:18px;margin:4px 0 10px"></div>
    <button class="primary-btn" id="doLogin">进 入 后 台</button>
  </div>
</div>

<div id="adminPanel" class="screen">
  <div class="panel-head glass">
    <div><h2>🛡️ 用户管理 <span style="font-size:12px;color:var(--text-dim)" id="userCount"></span></h2></div>
    <button class="ghost-btn" onclick="logout()">退出</button>
  </div>
  <div class="list glass" id="userList" style="border-radius:24px;margin-top:12px"></div>
</div>

<div id="toast"></div>

<script>
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const SUPABASE_URL = "https://qjsupbxshubysfnyhbwe.supabase.co";
const SUPABASE_KEY = "sb_publishable_PLydvfYMjBWnFY2eKSxTgQ_BAxYwTZp";
const ADMIN_PASSWORD = "admin123"; 

async function sbFetch(table, method = 'GET', body = null, query = '') {
  const url = `${SUPABASE_URL}/rest/v1/${table}${query ? '?' + query : ''}`;
  const headers = { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' };
  if (method === 'POST' || method === 'PATCH') headers['Prefer'] = 'return=representation';
  const res = await fetch(url, { method, headers, body: body ? JSON.stringify(body) : null });
  if (!res.ok) throw new Error(await res.text());
  const text = await res.text();
  return text ? JSON.parse(text) : {};
}

function toast(msg){ let el=$('#toast'); if(!el){el=document.createElement('div');el.id='toast';document.body.appendChild(el);} el.textContent=msg; el.classList.add('show'); clearTimeout(window._tt); window._tt=setTimeout(()=>el.classList.remove('show'),2200); }
function avatarHTML(u) { if(!u) return `<div class="avatar">?</div>`; if(u.avatar) return `<div class="avatar"><img src="${esc(u.avatar)}"></div>`; return `<div class="avatar" style="background:linear-gradient(140deg,#5eead4,#0ea5e9)">${esc((u.name||'?')[0])}</div>`; }
function fmt(ts){ const d=new Date(Number(ts)); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }

$('#doLogin').onclick = () => {
  if ($('#adminPwd').value === ADMIN_PASSWORD) {
    sessionStorage.setItem('admin_ok', '1');
    showAdmin();
  } else {
    $('#authMsg').textContent = '密码错误，请重试';
  }
};
$('#adminPwd').onkeydown = e => { if (e.key === 'Enter') $('#doLogin').click(); };

function logout(){ sessionStorage.removeItem('admin_ok'); location.reload(); }

async function showAdmin() {
  $('#authScreen').classList.add('hidden');
  $('#adminPanel').style.display = 'flex';
  await renderUsers();
  if (window._adminTimer) clearInterval(window._adminTimer);
  window._adminTimer = setInterval(renderUsers, 5000);
}

async function renderUsers() {
  try {
    const users = await sbFetch('users', 'GET', null, 'order=created_at.desc');
    $('#userCount').textContent = `共 ${users.length} 人`;
    const list = $('#userList');
    if (!users.length) {
      list.innerHTML = '<div style="text-align:center;color:var(--text-dim);padding:40px">还没有任何用户</div>';
      return;
    }
    list.innerHTML = users.map(u => `
      <div class="user-item">
        ${avatarHTML(u)}
        <div class="user-body">
          <div class="user-name">
            ${esc(u.name)}
            ${u.title ? `<span class="status-tag title-tag">${esc(u.title)}</span>` : ''}
            ${u.banned ? '<span class="status-tag banned">已封禁</span>' : ''}
          </div>
          <div class="user-info">ID: ${u.id} · 注册: ${fmt(u.created_at)}</div>
        </div>
        <div class="user-actions">
          ${u.banned 
            ? `<button class="ghost-btn" onclick="toggleBan('${u.id}', false)" style="padding:8px 12px;font-size:13px">解封</button>`
            : `<button class="danger-btn" onclick="toggleBan('${u.id}', true)">封禁</button>`}
          <button class="ghost-btn" onclick="setTitle('${u.id}', '${esc(u.title||'')}')" style="padding:8px 12px;font-size:13px">称号</button>
          <button class="ghost-btn" onclick="resetPassword('${u.id}')" style="padding:8px 12px;font-size:13px">改密码</button>
        </div>
      </div>
    `).join('');
  } catch (err) {
    console.error(err);
    toast('加载用户列表失败：' + err.message);
  }
}

window.toggleBan = async (id, ban) => {
  try {
    await sbFetch('users', 'PATCH', { banned: ban }, `id=eq.${id}`);
    toast(ban ? '已封禁该账号' : '已解封该账号');
    renderUsers();
  } catch (err) { toast('操作失败：' + err.message); }
};

window.setTitle = async (id, current) => {
  const newTitle = prompt('请输入要授予的称号（最多 8 个字，留空则清除）：', current);
  if (newTitle === null) return;
  if (newTitle.length > 8) return toast('称号最多 8 个字');
  try {
    await sbFetch('users', 'PATCH', { title: newTitle }, `id=eq.${id}`);
    toast('称号已更新');
    renderUsers();
  } catch (err) { toast('操作失败：' + err.message); }
};

window.resetPassword = async (id) => {
  const newPwd = prompt('请输入该用户的新密码（至少 4 位）：');
  if (!newPwd || newPwd.length < 4) return toast('密码太短或已取消');
  try {
    await sbFetch('users', 'PATCH', { pwd: newPwd }, `id=eq.${id}`);
    toast('密码已重置');
    renderUsers();
  } catch (err) { toast('操作失败：' + err.message); }
};

if (sessionStorage.getItem('admin_ok') === '1') showAdmin();
</script>
</body>
</html>
